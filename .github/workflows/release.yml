name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build exe and installer
        shell: pwsh
        run: |
          $env:Path += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          $ver = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "0.0.0-dev" }
          $env:ISCC_VERSION = $ver
          powershell -ExecutionPolicy Bypass -File packaging\build.ps1
          if (-not (Test-Path dist\PixelBuddy-Setup.exe)) { throw "installer missing" }
          Compress-Archive -Path dist\PixelBuddy -DestinationPath dist\PixelBuddy-win64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PixelBuddy
          path: |
            dist/PixelBuddy-Setup.exe
            dist/PixelBuddy-win64.zip

      - name: Publish release assets
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$env:GITHUB_REF_NAME" 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create "$env:GITHUB_REF_NAME" --title "$env:GITHUB_REF_NAME" --generate-notes }
          gh release upload "$env:GITHUB_REF_NAME" dist/PixelBuddy-Setup.exe dist/PixelBuddy-win64.zip --clobber
        shell: pwsh
